<!DOCTYPE html>
<html>
<head>
    <title>My superhero cards</title>#
    <style>
    
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4ff;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #ff4d4d;
    }

    p {
      color: #444444;
    }

    button {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .card-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .hero-card {
      background-color: white;
      border: 3px solid #ff4d4d;
      border-radius: 12px;
      width: 220px;
      padding: 18px;
    }

    .hero-name {
      font-size: 22px;
      font-weight: bold;
      color: #222222;
    }

    .hero-power {
      color: #0057b8;
      font-weight: bold;
    }

    .hero-mission {
      color: #666666;
      font-size: 14px;
    }
  </style>

    

 </head>
 <body>

    <h1>My Superhero Cards</h1>

    <p>
        Click the button to create superhero objects using javascript.
    </p>

    <button onclick="showHeroes()">Show Superheroes</button>

    <div class="card-container" id="heroCards"></div>
    <div id="card1"></div>
    <div id="card2"></div>
    <div id="card3"></div>

    <script>

        class Superhero {
          constructor(name, power) {
               this.name = name;
                this.power = power;
            }
            describe() {
              return this.name + ": " + this.power;
            }
        }

        function showHeroes() {
          let p1 = new Superhero("Superman", "The one who can fly");
          let p2 = new Superhero("Captain America", "The one with the sheild and super strenght");
          let p3 = new Superhero("Thor", "The one with the lighting abilities and hammer");

          document.getElementById("card1").innerHTML =
          "<div class='card'><div class='planet-name'>" + p1.name + "</div>" +
                "<div class='planet-fact'>" + p1.describe() + "</div></div>";

          document.getElementById("card2").innerHTML =
          "<div class='card'><div class='planet-name'>" + p2.name + "</div>" +
                "<div class='planet-fact'>" + p2.describe() + "</div></div>";

          document.getElementById("card3").innerHTML =
          "<div class='card'><div class='planet-name'>" + p3.name + "</div>" +
          "<div class='planet-fact'>" + p3.describe() + "</div></div>";


        }
    </script>
</body>


</html>
